    <div class="masthead-tools"><div id="profile-mount"></div><button id="btn-settings" class="settings-btn" type="button" aria-label="Mở cài đặt">⚙ <span>Cài đặt</span></button></div>

        <span class="nav-btn-vi">Xếp hạng</span>

    <button class="nav-btn" data-route="exam" type="button">
        <span class="nav-btn-jp" lang="ja">模試</span>
        <span class="nav-btn-vi">Thi thử</span>
